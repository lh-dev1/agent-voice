[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-voice"
version = "0.1.0"
description = "Local desktop voice command assistant MVP for medical workstation workflows."
requires-python = ">=3.9"
dependencies = [
  "sherpa-onnx==1.13.1",
  "sounddevice==0.5.5",
  "numpy==2.0.2",
  "click==8.1.8",
  "sentencepiece==0.2.1",
  "pypinyin==0.55.0",
  "torch==2.11.0",
  "torchaudio==2.11.0",
  "funasr==1.3.1",
  "soundfile==0.13.1",
  "PySide6==6.11.0",
]

[project.scripts]
agent-voice = "agent_voice.app:main"

[tool.setuptools.packages.find]
include = ["agent_voice*"]
